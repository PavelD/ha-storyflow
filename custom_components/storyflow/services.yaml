# StoryFlow Services
set_task_state:
  name: Set Task State
  description: Update the state of a task
  fields:
    task_id:
      name: Task ID
      description: The unique identifier of the task
      required: true
      example: "storyflow_my_story_task_0"
      selector:
        text:
    new_state:
      name: New State
      description: The new state for the task
      required: true
      example: "progress"
      selector:
        select:
          options:
            - "todo"
            - "progress"
            - "review"
            - "done"
            - "rejected"

assign_task:
  name: Assign Task
  description: Assign a task to a person
  fields:
    task_id:
      name: Task ID
      description: The unique identifier of the task
      required: true
      example: "storyflow_my_story_task_0"
      selector:
        text:
    person_id:
      name: Person ID
      description: The entity ID of the person to assign (leave empty to unassign)
      required: false
      example: "person.john"
      selector:
        entity:
          domain: person

add_task:
  name: Add Task
  description: Add a new task to an existing story
  fields:
    story_id:
      name: Story ID
      description: The identifier of the story to add the task to
      required: true
      example: 'kitchen'
      selector:
        text:
    title:
      name: Title
      description: The task title
      required: true
      example: 'Paint walls'
      selector:
        text:
    description:
      name: Description
      description: Detailed task description (optional)
      required: false
      example: 'Choose color and paint the living room walls'
      selector:
        text:
    assigned_to:
      name: Assigned To
      description: Person entity ID to assign this task to (optional)
      required: false
      example: 'person.john'
      selector:
        entity:
          domain: person
    state:
      name: Initial State
      description: Initial state for the task (defaults to todo)
      required: false
      default: 'todo'
      selector:
        select:
          options:
            - 'todo'
            - 'progress'
            - 'review'
            - 'done'
            - 'rejected'

clone_story:
  name: Clone Story
  description: Create a copy of a story with reset tasks
  fields:
    story_id:
      name: Story ID
      description: The identifier of the story to clone
      required: true
      example: "my_story"
      selector:
        text:
    new_story_name:
      name: New Story Name
      description: Name for the cloned story (optional)
      required: false
      example: "My Story (Copy)"
      selector:
        text:
